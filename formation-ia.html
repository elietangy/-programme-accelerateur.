<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posts du Jour - Formation L'IA Pratique pour Tous</title>
<style>
  :root { --bg:#f4f7f6; --card:#fff; --txt:#1a202c; --muted:#718096; --brand:#2563eb; --ok:#2f9e5b; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--txt); line-height:1.5; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  h1 { text-align:center; font-size:1.5em; margin:10px 0 2px; }
  .sub { text-align:center; color:var(--muted); margin:0 0 12px; }
  .count { text-align:center; background:var(--brand); color:#fff; border-radius:10px; padding:10px; font-weight:700; margin-bottom:12px; }
  .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .nav button { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font-size:1em; }
  .date { font-weight:700; text-align:center; flex:1; text-transform:capitalize; }
  .opts { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:16px; font-size:.95em; }
  .opts label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .post { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .tag { display:inline-block; font-size:.75em; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--brand); margin-bottom:6px; }
  .text { white-space:pre-wrap; margin:0 0 12px; font-family:inherit; font-size:1em; }
  .copy { width:100%; background:var(--brand); color:#fff; border:0; border-radius:8px; padding:12px; font-size:1.05em; font-weight:700; cursor:pointer; }
  .copy.done { background:var(--ok); }
  .all { width:100%; background:#1a202c; color:#fff; border:0; border-radius:8px; padding:12px; font-size:1em; font-weight:700; cursor:pointer; margin-bottom:16px; }
  .wa { display:block; text-align:center; background:#25d366; color:#fff; text-decoration:none; border-radius:8px; padding:10px; font-weight:700; margin-bottom:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📅 Posts du jour : L'IA Pratique pour Tous</h1>
  <p class="sub">Samedi 31 octobre 2026 · Porto-Novo. Tu n'as qu'à copier.</p>
  <div class="count" id="count"></div>

  <div class="nav">
    <button id="prev" aria-label="Jour précédent">◀</button>
    <div class="date" id="date"></div>
    <button id="next" aria-label="Jour suivant">▶</button>
  </div>

  <div class="opts">
    <label><input type="checkbox" id="optCount" checked> Compte à rebours</label>
    <label><input type="checkbox" id="optInfo" checked> Infos pratiques</label>
    <label><input type="checkbox" id="optCta" checked> Appel à l'action</label>
    <label><input type="checkbox" id="optTags" checked> Hashtags</label>
  </div>

  <button class="all" id="copyAll">📋 Copier les 3 posts</button>
  <div id="posts"></div>
  <a class="wa" href="https://wa.me/2290196486626" target="_blank" rel="noopener">💬 Ouvrir WhatsApp (01 96 48 66 26)</a>
</div>

<script>
// ---------- À MODIFIER SI BESOIN ----------
const EVENT = { y: 2026, m: 10, d: 31 };   // date de la formation
const CLOSE = { y: 2026, m: 10, d: 27 };   // fin des inscriptions
const INFO = "📍 Samedi 31 octobre 2026, de 9h à 13h\nPorto-Novo, salle de l'ONG ADIL\n💰 15 000 FCFA (4h de formation + 30 jours de suivi WhatsApp)\n🔒 Avance de 5 000 FCFA pour bloquer votre place\n👥 40 places seulement\n⏰ Inscriptions jusqu'au 27 octobre";
const CTA = "👉 Pour réserver votre place, envoyez « OUI » sur WhatsApp au 01 96 48 66 26.";
const TAGS = "#IA #IntelligenceArtificielle #ChatGPT #PortoNovo #Bénin #Formation";
// ------------------------------------------

// Posts pendant les inscriptions. {J} = « dans X jours »
const OPEN = [
  ["Accroche", "Tout le monde parle de l'intelligence artificielle.\nTrès peu de personnes savent vraiment s'en servir.\n\nEt vous ?\n\nLe 31 octobre à Porto-Novo, en une matinée, apprenez à utiliser l'IA de façon simple et utile pour votre quotidien ou votre activité."],
  ["Problème", "Vous avez déjà ouvert ChatGPT, tapé une question au hasard… et refermé l'onglet sans comprendre ?\n\nCe n'est pas votre faute. Personne ne vous a montré comment faire, étape par étape, avec des exemples de votre vie de tous les jours.\n\nC'est exactement ce que nous allons faire ensemble."],
  ["Programme", "Ce que vous allez apprendre en 4 heures :\n\n1️⃣ Comprendre l'IA avec des mots simples\n2️⃣ Écrire une bonne consigne (prompt)\n3️⃣ Créer un CV, un post, une affiche, une vidéo courte, un chatbot\n4️⃣ Faire votre exercice sur votre téléphone\n5️⃣ Découvrir des opportunités économiques liées à l'IA\n6️⃣ 30 jours d'accompagnement sur WhatsApp"],
  ["Méthode", "Notre méthode : VOIR, FAIRE, REFAIRE.\n\n👀 Vous voyez la démonstration en direct sur grand écran\n📱 Vous le faites vous-même sur votre téléphone\n🔁 Vous recommencez avec de l'aide si vous bloquez\n\nC'est ce qui fait la différence entre « j'ai vu une démo » et « je sais le refaire seul »."],
  ["Pour qui", "Cette formation est pour vous si :\n\n✅ Vous êtes entrepreneur, commerçant, étudiant, salarié ou artisan\n✅ Vous n'avez jamais utilisé l'IA, ou très peu\n✅ Vous voulez des résultats concrets, pas de la théorie\n\nAucun niveau technique n'est demandé."],
  ["Honnêteté", "Soyons clairs.\n\n❌ Ce n'est pas une formation en ligne\n❌ Ce n'est pas une promesse de revenu garanti\n❌ Ce n'est pas pour les experts en IA\n\n✅ C'est une matinée pratique, en présentiel, pour repartir en sachant vraiment vous servir de l'IA."],
  ["Inclus", "Ce qui est inclus dans votre place :\n\n📘 Un support de formation complet\n📝 Un guide de prompts prêts à l'emploi\n✏️ Un cahier d'exercices\n👥 Un groupe WhatsApp d'entraide\n🎯 30 jours de défis quotidiens, corrigés personnellement\n🎓 Un certificat de participation"],
  ["Entrepreneurs", "Commerçant, couturière, artisan, prestataire…\n\nImaginez créer vos publications Facebook et WhatsApp, vos affiches et vos messages clients en quelques minutes au lieu de plusieurs heures.\n\nC'est possible avec l'IA. Et ça s'apprend en une matinée."],
  ["Étudiants", "Étudiants : l'IA peut vous aider à mieux comprendre vos cours, préparer un exposé ou rédiger un CV propre.\n\nMais encore faut-il savoir lui poser les bonnes questions.\n\nC'est le cœur de la formation du 31 octobre."],
  ["Salariés", "Salarié ? L'IA peut vous faire gagner des heures chaque semaine : rédaction de courriers, résumés, idées, organisation.\n\nChaque semaine sans l'utiliser est une semaine où vous auriez pu gagner du temps.\n\nCommencez le 31 octobre."],
  ["Prompt", "Astuce du jour : une bonne consigne donne une bonne réponse.\n\n❌ « Fais-moi un post »\n✅ « Écris un post Facebook de 5 lignes pour ma boutique de vêtements à Porto-Novo, ton chaleureux, avec un appel à m'écrire sur WhatsApp »\n\nPlus c'est précis, meilleur est le résultat. On pratique tout ça en formation."],
  ["Astuce", "Astuce : donnez un rôle à l'IA.\n\n« Tu es un conseiller qui aide les petits commerçants. Propose-moi 5 idées pour attirer plus de clients cette semaine. »\n\nLe rôle change complètement la qualité de la réponse. Vous apprendrez ce genre de techniques le 31 octobre."],
  ["Futur", "Dans dix ans, l'IA fera partie du quotidien de tout le monde, comme le téléphone portable aujourd'hui.\n\nLa question n'est pas de savoir SI vous allez l'utiliser, mais QUAND vous allez commencer."],
  ["Concurrents", "Vos concurrents s'en servent déjà pour gagner du temps.\nVos enfants l'utilisent pour leurs devoirs.\n\nEt vous, vous regardez de loin ?\n\nUne matinée suffit pour prendre de l'avance."],
  ["Suivi", "Une formation d'un jour, ça s'oublie vite.\n\nC'est pourquoi chaque participant reçoit 30 jours de suivi sur WhatsApp : un défi par jour, corrigé personnellement.\n\nVous ne repartez pas seul."],
  ["Places", "⚠️ Seulement 40 places.\n\nUne avance de 5 000 FCFA bloque votre place. Dès que les 40 places sont prises, les inscriptions ferment, même avant le 27 octobre."],
  ["Prix", "15 000 FCFA pour :\n\n• 4 heures de formation pratique\n• Tout le matériel (support, guide de prompts, cahier d'exercices)\n• 30 jours de suivi WhatsApp\n• Un certificat de participation\n\nAvance de 5 000 FCFA pour réserver."],
  ["Question", "Question : qu'aimeriez-vous que l'IA fasse pour vous ?\n\n✍️ Écrire vos messages ?\n🎨 Créer vos affiches ?\n🎬 Faire une vidéo ?\n🤖 Répondre à vos clients ?\n\nRépondez en commentaire. On le voit ensemble le 31 octobre."],
  ["Démo", "En direct pendant la formation, nous créons ensemble :\n\n📄 Un CV\n📣 Un post Facebook ou WhatsApp\n🖼️ Une affiche\n🎥 Une vidéo courte\n🤖 Un chatbot\n\nPuis c'est votre tour, sur votre téléphone."]
];

// Inscriptions fermées, formation pas encore passée
const LATE = [
  ["Inscriptions closes", "🔒 Les inscriptions pour la formation « L'IA Pratique pour Tous » sont closes.\n\nMerci à tous ceux qui ont réservé leur place ! Rendez-vous le samedi 31 octobre, de 9h à 13h, à Porto-Novo, salle de l'ONG ADIL."],
  ["Préparation", "Participants du 31 octobre, pour bien préparer la matinée :\n\n📱 Venez avec votre téléphone chargé\n📶 Prévoyez de la connexion internet\n📝 Apportez de quoi noter\n⏰ Arrivez un peu avant 9h\n\nOn s'occupe du reste !"],
  ["Rappel", "Rappel pour nos participants :\n\n📍 Salle de l'ONG ADIL, Porto-Novo\n🗓️ Samedi 31 octobre, de 9h à 13h\n\nPensez à ce que vous voulez que l'IA fasse pour vous. On le mettra en pratique ensemble."]
];

// Jour J
const DAYOF = [
  ["Jour J", "C'est AUJOURD'HUI ! 🎉\n\nFormation « L'IA Pratique pour Tous »\n⏰ 9h – 13h\n📍 Porto-Novo, salle de l'ONG ADIL\n\nVenez avec votre téléphone chargé. À tout à l'heure !"],
  ["Jour J", "Dans quelques heures, vous saurez écrire une consigne pour l'IA, créer un post, une affiche et bien plus.\n\nOn commence à 9h précises. Soyez à l'heure ! 😉"],
  ["Jour J", "La formation est en cours à Porto-Novo ! 🔥\n\nMerci aux participants pour leur énergie. Ce soir, vous saurez vous servir de l'IA."]
];

// Après la formation
const AFTER = [
  ["Merci", "Merci à tous les participants de « L'IA Pratique pour Tous » ! 🙏\n\nQuelle matinée. Vous avez vu, fait et refait. Le plus important commence maintenant : pratiquer chaque jour."],
  ["Suivi", "Participants : vos 30 jours de défis quotidiens ont commencé sur WhatsApp.\n\n1 défi par jour, 10 minutes, et vous progressez pour de bon. Ne lâchez rien !"],
  ["Rappel", "L'IA, c'est comme un muscle : plus on l'utilise, plus on devient bon.\n\nAujourd'hui, essayez une chose : demandez à l'IA de vous aider sur une tâche réelle de votre journée."]
];

// Posts spéciaux pour des jours précis, indexés par « jours restants » (remplacent le 1er post du jour)
const SPECIAL = {
  30: ["Lancement", "🚀 NOUVEAU : « L'IA Pratique pour Tous »\n\nUne formation pratique de 4 heures pour apprendre à utiliser l'intelligence artificielle, sans jargon.\n\n📍 Porto-Novo · 🗓️ Samedi 31 octobre, 9h–13h\n\nLes places sont limitées à 40. Ouverture des inscriptions maintenant !"],
  14: ["J-14", "Il reste 2 semaines avant la formation et les places partent.\n\nSi vous hésitez encore : une matinée, des exemples concrets, 30 jours de suivi. Vous n'avez rien à perdre à venir essayer."],
  7: ["J-7", "⏳ Dans une semaine, vous saurez utiliser l'IA.\n\nIl reste quelques places pour le samedi 31 octobre à Porto-Novo. N'attendez pas la dernière minute."],
  5: ["J-5", "Plus que quelques jours pour vous inscrire.\n\nLes inscriptions ferment le 27 octobre, ou dès que les 40 places sont prises. Envoyez « OUI » sur WhatsApp pour bloquer la vôtre."],
  4: ["Dernier jour", "🔔 DERNIER JOUR pour vous inscrire !\n\nLes inscriptions ferment ce soir. Après, ce sera trop tard pour réserver votre place du 31 octobre."]
};

const $ = id => document.getElementById(id);
let offset = 0;
const dnum = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / 86400000);
const EVENT_N = dnum(EVENT.y, EVENT.m, EVENT.d);
const CLOSE_LEFT = EVENT_N - dnum(CLOSE.y, CLOSE.m, CLOSE.d);   // jours restants le dernier jour d'inscription

const phrase = n => n === 1 ? "demain" : "dans " + n + " jours";

function pick(pool, day, i) { return pool[(day * 3 + i) % pool.length]; }

function postsFor(left, day) {
  const pools = left < 0 ? AFTER : left === 0 ? DAYOF : left < CLOSE_LEFT ? LATE : OPEN;
  const res = [0, 1, 2].map(i => pools === DAYOF ? DAYOF[i] : pick(pools, day, i));
  if (SPECIAL[left]) res[0] = SPECIAL[left];
  return res;
}

function build(p, left) {
  let t = p[1];
  const open = left >= CLOSE_LEFT;
  if ($("optCount").checked && left > 0) t = "⏳ Formation " + phrase(left) + " !\n\n" + t;
  if ($("optInfo").checked && open) t += "\n\n" + INFO;
  if ($("optCta").checked && open) t += "\n\n" + CTA;
  if ($("optTags").checked) t += "\n\n" + TAGS;
  return t;
}

async function copy(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  const old = btn.textContent; btn.textContent = "✅ " + label; btn.classList.add("done");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
}

function render() {
  const d = new Date(); d.setDate(d.getDate() + offset);
  const day = dnum(d.getFullYear(), d.getMonth() + 1, d.getDate());
  const left = EVENT_N - day;
  $("date").textContent = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  $("count").textContent = left > 1 ? "⏳ J-" + left + " avant la formation" : left === 1 ? "⏳ La formation est DEMAIN" : left === 0 ? "🎉 C'est le jour J !" : "✅ Formation terminée";
  const box = $("posts"); box.innerHTML = "";
  const texts = [];
  ["🌅 Matin", "☀️ Midi", "🌙 Soir"].forEach((slot, i) => {
    const p = postsFor(left, day)[i];
    const text = build(p, left); texts.push(text);
    const card = document.createElement("div"); card.className = "post";
    const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = slot + " · " + p[0];
    const pre = document.createElement("pre"); pre.className = "text"; pre.textContent = text;
    const btn = document.createElement("button"); btn.className = "copy"; btn.textContent = "📋 Copier";
    btn.onclick = () => copy(text, btn, "Copié !");
    card.append(tag, pre, btn); box.appendChild(card);
  });
  $("copyAll").onclick = () => copy(texts.join("\n\n———\n\n"), $("copyAll"), "Les 3 posts sont copiés !");
}

$("prev").onclick = () => { offset--; render(); };
$("next").onclick = () => { offset++; render(); };
["optCount", "optInfo", "optCta", "optTags"].forEach(id => $(id).onchange = render);
render();
</script>
</body>
</html>
